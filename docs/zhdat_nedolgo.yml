project:
  name: "Ждать недолго"
  type: "Сервис курьерской доставки"
  goal: "Организовать быструю доставку заказов за счет обработки заказов, назначения курьеров и построения маршрутов"

actors:
  - name: "Клиент"
    description: "Оформляет заказ, оплачивает его и отслеживает статус доставки"

  - name: "Курьер"
    description: "Принимает доставку, забирает заказ у партнера и доставляет клиенту"

  - name: "Ресторан-партнер"
    description: "Получает заказ, подтверждает его и готовит к передаче курьеру"

  - name: "Диспетчер"
    description: "Контролирует процесс доставки и решает спорные ситуации"

  - name: "Оператор поддержки"
    description: "Обрабатывает обращения клиентов и курьеров"

architecture:
  frontend:
    name: "Клиентское приложение"
    technology: "React"
    responsibilities:
      - "Отображение интерфейса пользователя"
      - "Создание заказа"
      - "Просмотр статуса доставки"
      - "Отправка запросов на backend"

  backend:
    name: "Backend API"
    technology: "FastAPI"
    responsibilities:
      - "Обработка заказов"
      - "Расчет стоимости заказа"
      - "Назначение курьера"
      - "Работа со статусами доставки"
      - "Отправка уведомлений"

  database:
    name: "База данных"
    technology: "PostgreSQL"
    responsibilities:
      - "Хранение пользователей"
      - "Хранение заказов"
      - "Хранение курьеров"
      - "Хранение доставок"
      - "Хранение оплат"

  ci_cd:
    name: "GitHub Actions"
    responsibilities:
      - "Автоматический запуск тестов backend"
      - "Проверка сборки frontend"
      - "Проверка структуры проекта"

business_process:
  name: "Оформление и доставка заказа"
  steps:
    - number: 1
      actor: "Клиент"
      action: "Создает заказ в приложении"
      component: "frontend"

    - number: 2
      actor: "Backend API"
      action: "Принимает данные заказа и проверяет корректность"
      component: "backend"

    - number: 3
      actor: "Backend API"
      action: "Рассчитывает итоговую стоимость заказа"
      component: "backend"

    - number: 4
      actor: "Ресторан-партнер"
      action: "Принимает заказ и начинает приготовление"
      component: "backend"

    - number: 5
      actor: "Сервис назначения курьера"
      action: "Ищет свободного курьера"
      component: "backend"

    - number: 6
      actor: "Сервис маршрутов"
      action: "Строит маршрут от ресторана до клиента"
      component: "backend"

    - number: 7
      actor: "Курьер"
      action: "Забирает заказ и доставляет его клиенту"
      component: "courier_application"

    - number: 8
      actor: "Сервис уведомлений"
      action: "Отправляет клиенту уведомления о статусе заказа"
      component: "backend"

classes:
  entities:
    - name: "Пользователь"
      fields:
        - "id"
        - "имя"
        - "телефон"
        - "email"

    - name: "Клиент"
      extends: "Пользователь"
      fields:
        - "адрес"
        - "бонусныеБаллы"

    - name: "Курьер"
      extends: "Пользователь"
      fields:
        - "типТранспорта"
        - "статус"
        - "текущееМестоположение"

    - name: "Заказ"
      fields:
        - "id"
        - "статус"
        - "итоговаяСтоимость"
        - "датаСоздания"

    - name: "ПозицияЗаказа"
      fields:
        - "id"
        - "название"
        - "количество"
        - "цена"

    - name: "Доставка"
      fields:
        - "id"
        - "статус"
        - "примерноеВремя"

    - name: "Маршрут"
      fields:
        - "начальнаяТочка"
        - "конечнаяТочка"
        - "расстояние"
        - "примерноеВремя"

    - name: "Оплата"
      fields:
        - "id"
        - "сумма"
        - "способОплаты"
        - "статус"

    - name: "Уведомление"
      fields:
        - "id"
        - "сообщение"
        - "тип"
        - "датаСоздания"

  services:
    - name: "СервисЗаказов"
      responsibility: "Создание, отмена и изменение статуса заказа"

    - name: "СервисНазначенияКурьера"
      responsibility: "Поиск свободного курьера и назначение его на доставку"

    - name: "СервисМаршрутов"
      responsibility: "Построение маршрута и расчет времени доставки"

    - name: "СервисОплаты"
      responsibility: "Обработка оплаты и возврата средств"

    - name: "СервисУведомлений"
      responsibility: "Отправка уведомлений клиенту и курьеру"

    - name: "СервисАналитики"
      responsibility: "Расчет показателей доставки и формирование отчетов"

relationships:
  - from: "Клиент"
    to: "Заказ"
    type: "создает"

  - from: "Заказ"
    to: "ПозицияЗаказа"
    type: "содержит"

  - from: "Заказ"
    to: "Ресторан-партнер"
    type: "передается"

  - from: "Заказ"
    to: "Доставка"
    type: "имеет"

  - from: "Доставка"
    to: "Курьер"
    type: "назначается"

  - from: "Доставка"
    to: "Маршрут"
    type: "использует"

  - from: "Заказ"
    to: "Оплата"
    type: "оплачивается"

solid_principles:
  single_responsibility:
    description: "Каждый сервис отвечает только за одну часть бизнес-логики"
    examples:
      - "СервисЗаказов работает только с заказами"
      - "СервисНазначенияКурьера отвечает только за выбор курьера"
      - "СервисМаршрутов отвечает только за построение маршрутов"
      - "СервисОплаты отвечает только за оплату"
      - "СервисУведомлений отвечает только за уведомления"

  open_closed:
    description: "Систему можно расширять без изменения существующей логики"
    examples:
      - "Можно добавить новый способ оплаты"
      - "Можно добавить новый способ уведомлений"
      - "Можно добавить новый алгоритм назначения курьера"

  liskov_substitution:
    description: "Дочерние классы пользователей могут использоваться как базовый класс Пользователь"
    examples:
      - "Клиент наследуется от Пользователь"
      - "Курьер наследуется от Пользователь"
      - "Диспетчер наследуется от Пользователь"

  interface_segregation:
    description: "Интерфейсы разделены по назначению"
    examples:
      - "ИнтерфейсОплаты отвечает только за оплату"
      - "ИнтерфейсОтправкиУведомлений отвечает только за отправку сообщений"

  dependency_inversion:
    description: "Сервисы зависят от интерфейсов, а не от конкретных реализаций"
    examples:
      - "СервисОплаты зависит от ИнтерфейсОплаты"
      - "СервисУведомлений зависит от ИнтерфейсОтправкиУведомлений"

ci_cd:
  workflow_file: ".github/workflows/ci-cd.yml"
  triggers:
    - "push в ветку main"
    - "pull request в ветку main"

  jobs:
    - name: "backend-tests"
      description: "Установка Python-зависимостей и запуск тестов pytest"

    - name: "frontend-build"
      description: "Установка Node.js-зависимостей, проверка frontend и сборка проекта"

    - name: "project-structure-check"
      description: "Проверка наличия обязательных папок и файлов проекта"