name: CI/CD для сервиса доставки

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  backend-tests:
    name: Тестирование backend
    runs-on: ubuntu-latest

    steps:
      - name: Загрузка репозитория
        uses: actions/checkout@v4

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Установка зависимостей backend
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Запуск тестов backend
        run: |
          cd backend
          pytest -v

  frontend-build:
    name: Сборка frontend
    runs-on: ubuntu-latest

    steps:
      - name: Загрузка репозитория
        uses: actions/checkout@v4

      - name: Установка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Установка зависимостей frontend
        run: npm install
        working-directory: frontend

      - name: Проверка frontend
        run: npm test
        working-directory: frontend

      - name: Сборка frontend
        run: npm run build
        working-directory: frontend

  project-structure-check:
    name: Проверка структуры проекта
    runs-on: ubuntu-latest

    steps:
      - name: Загрузка репозитория
        uses: actions/checkout@v4

      - name: Проверка структуры
        run: |
          echo "Проверка структуры проекта"

          test -d backend || (echo "Нет папки backend" && exit 1)
          test -d backend/app || (echo "Нет папки backend/app" && exit 1)
          test -f backend/app/__init__.py || (echo "Нет backend/app/__init__.py" && exit 1)
          test -f backend/app/main.py || (echo "Нет backend/app/main.py" && exit 1)
          test -f backend/app/services.py || (echo "Нет backend/app/services.py" && exit 1)
          test -f backend/requirements.txt || (echo "Нет backend/requirements.txt" && exit 1)
          test -d backend/tests || (echo "Нет папки backend/tests" && exit 1)
          test -f backend/tests/test_main.py || (echo "Нет backend/tests/test_main.py" && exit 1)
          test -f backend/tests/test_order_service.py || (echo "Нет backend/tests/test_order_service.py" && exit 1)
          test -f backend/tests/test_courier_service.py || (echo "Нет backend/tests/test_courier_service.py" && exit 1)

          test -d frontend || (echo "Нет папки frontend" && exit 1)
          test -f frontend/package.json || (echo "Нет frontend/package.json" && exit 1)
          test -d frontend/src || (echo "Нет папки frontend/src" && exit 1)

          test -d docs || (echo "Нет папки docs" && exit 1)

          echo "Структура проекта корректна"